services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "autoheal=true"

  n8n:
    image: local/n8n-python:2.16.1
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=n8n.34.248.143.39.nip.io
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.34.248.143.39.nip.io/
      - N8N_EDITOR_BASE_URL=https://n8n.34.248.143.39.nip.io/
      - GENERIC_TIMEZONE=Europe/Dublin
      - TZ=Europe/Dublin
      - N8N_LOG_LEVEL=info
      - N8N_PROXY_HOPS=1
      - N8N_RUNNERS_TASK_REQUEST_TIMEOUT=1800
      - N8N_RUNNERS_HEARTBEAT_INTERVAL=30
      - N8N_RUNNERS_TASK_TIMEOUT=1800
      - N8N_RUNNERS_TASK_BROKER_OFFER_VALIDITY=60000
      - N8N_RUNNERS_MAX_CONCURRENCY=3
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=10
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - NODE_OPTIONS=--max-old-space-size=3072
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - OPENROUTER_KEY=${OPENROUTER_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - HUNTER_KEY=${HUNTER_KEY:-}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID:-}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY:-}
      - JOOBLE_KEY=${JOOBLE_KEY:-}
      - FINDWORK_KEY=${FINDWORK_KEY:-}
      - RAPIDAPI_KEY=${RAPIDAPI_KEY:-}
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      - APIFY_TOKEN=${APIFY_TOKEN:-}
      - THEIRSTACK_KEY=${THEIRSTACK_KEY:-}
      - WAAH_WEBHOOK_URL=${WAAH_WEBHOOK_URL:-}
      - AGGREGATORS_ON=${AGGREGATORS_ON:-}
      - PAID_AGGREGATORS_ON=${PAID_AGGREGATORS_ON:-}
      - RSS_ON=${RSS_ON:-}
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_PROGRESS=true
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=1500
      - EXECUTIONS_TIMEOUT=5400
      - EXECUTIONS_TIMEOUT_MAX=7200
      - N8N_RUNNERS_PYTHON_ENABLED=false
      - N8N_DISABLE_PYTHON_TASK_RUNNER=true
      - N8N_EXPERIMENTAL_FEATURE_PYTHON_TASK_RUNNER=false
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_BINARY_DATA_TTL=60
    volumes:
      - n8n_data:/home/node/.n8n
      - /home/ubuntu/node-types.js:/usr/local/lib/node_modules/n8n/dist/node-types.js:ro
    labels:
      - "autoheal=true"
    mem_limit: 3500m
    mem_reservation: 2048m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz | grep -q ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  n8n_data:
    external: true
    name: n8n_n8n_data
  pg_data:
